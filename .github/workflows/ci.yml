name: DevOps CI Pipeline

on:
  push:
    branches: [dev, main, feature/*]
  pull_request:
    branches: [dev]
  release:
    types: [created]

jobs:
  # Pipeline pour PR - Build & Smoke Test
  pr-pipeline:
    if: github.event_name == 'pull_request'
    name: PR Pipeline - Build & Smoke
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Smoke Test
      run: |
        npm install -g serve
        npx serve -s dist -l 3000 &
        sleep 10
        curl -f http://localhost:3000 && echo "✅ Smoke Test PASSED" || exit 1

  # Pipeline pour push sur dev - Build Complet
  dev-pipeline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    name: Dev Pipeline - Full Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Run tests
      run: |
        npm install -g serve
        npx serve -s dist -l 3000 &
        sleep 10
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
        if [ "$response" -eq 200 ]; then
          echo "✅ Smoke Test PASSED - Status: $response"
        else
          echo "❌ Smoke Test FAILED - Status: $response"
          exit 1
        fi
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          dist/
          Dockerfile
          scripts/

  # Pipeline pour tags - Build Versionné
  tag-pipeline:
    if: github.event_name == 'release'
    name: Tag Pipeline - Versioned Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Run comprehensive tests
      run: |
        npm install -g serve
        npx serve -s dist -l 3000 &
        sleep 10
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
        if [ "$response" -eq 200 ]; then
          echo "✅ Comprehensive Test PASSED - Status: $response"
        else
          echo "❌ Comprehensive Test FAILED - Status: $response"
          exit 1
        fi
        
    - name: Upload versioned artifacts
      uses: actions/upload-artifact@v3
      with:
        name: versioned-artifacts-${{ github.event.release.tag_name }}
        path: |
          dist/
          Dockerfile
          scripts/
          package.json
        retention-days: 30
